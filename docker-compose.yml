services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow
      POSTGRES_DB: mlflow
    volumes:
      - mlflow_db:/var/lib/postgresql/data

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.16.1
    depends_on:
      - postgres
    ports:
      - "5001:5000"
    environment:
      MLFLOW_TRACKING_URI: postgresql://mlflow:mlflow@postgres:5432/mlflow
    volumes:
      - mlflow_artifacts:/mlartifacts
    command:
      - bash
      - -c
      - >
        pip install psycopg2-binary &&
        mlflow server
        --host 0.0.0.0
        --port 5000
        --backend-store-uri postgresql://mlflow:mlflow@postgres:5432/mlflow
        --artifacts-destination /mlartifacts

  api:
    build: .
    depends_on:
      - mlflow
    ports:
      - "8000:8000"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    command: >
      uv run --no-dev uvicorn
      app.main:app
      --host 0.0.0.0
      --port 8000

volumes:
  mlflow_db:
  mlflow_artifacts: